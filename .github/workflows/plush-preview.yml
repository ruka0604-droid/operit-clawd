name: Build Plush Heng preview
on:
  push:
    branches: [plush-heng-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify ToolPkg
        run: python3 tools/build_plush_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: plush-heng-preview
          path: dist/*.toolpkg
          if-no-files-found: error
